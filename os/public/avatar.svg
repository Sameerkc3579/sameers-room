<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/>
      <stop offset="1" stop-color="#e2735c"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a8c"/>
      <stop offset="1" stop-color="#2b3f66"/>
    </linearGradient>
    <clipPath id="frame"><rect width="96" height="96" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="96" height="96" fill="url(#bg)"/>
    <circle cx="74" cy="22" r="10" fill="#fff3d1" opacity=".7"/>
    <!-- shoulders -->
    <path d="M14 96c2-18 16-27 34-27s32 9 34 27z" fill="url(#hoodie)"/>
    <path d="M40 70l8 9 8-9" fill="none" stroke="#e9e2d0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- neck + face -->
    <rect x="42" y="56" width="12" height="14" rx="5" fill="#b9805b"/>
    <ellipse cx="48" cy="44" rx="17" ry="19" fill="#c98e66"/>
    <ellipse cx="31.5" cy="46" rx="3" ry="4.5" fill="#b9805b"/>
    <ellipse cx="64.5" cy="46" rx="3" ry="4.5" fill="#b9805b"/>
    <!-- hair -->
    <path d="M30 42c-2-15 8-24 19-24 12 0 20 8 18 23-3-6-7-10-14-11-3 4-12 6-23 12z" fill="#1f1a1d"/>
    <!-- glasses -->
    <g fill="none" stroke="#2a2326" stroke-width="1.8">
      <rect x="36" y="42" width="10" height="7.5" rx="2.5"/>
      <rect x="50" y="42" width="10" height="7.5" rx="2.5"/>
      <path d="M46 45h4"/>
    </g>
    <circle cx="41" cy="46" r="1.4" fill="#2a2326"/>
    <circle cx="55" cy="46" r="1.4" fill="#2a2326"/>
    <path d="M43 55c3 2.5 7 2.5 10 0" fill="none" stroke="#7a4636" stroke-width="1.8" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M28 46c0-17 9-27 20-27s20 10 20 27" fill="none" stroke="#2a2326" stroke-width="4"/>
    <rect x="24" y="40" width="9" height="14" rx="4" fill="#f08a24" stroke="#2a2326" stroke-width="1.5"/>
    <rect x="63" y="40" width="9" height="14" rx="4" fill="#f08a24" stroke="#2a2326" stroke-width="1.5"/>
  </g>
</svg>
